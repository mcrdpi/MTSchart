<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RTR MTS">
<meta name="theme-color" content="#f1f4f5">
<title>RTR MTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
<style>
/* ============ tokens: light (default) ============ */
:root{
  --f:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --bg:#f1f4f5; --surface:#ffffff; --surface2:#f6f8f9; --surface3:#edf1f3;
  --ink:#24323d; --ink2:#3d4b57; --muted:#6c7a85; --line:#e2e7ea; --line2:#cdd6dc;
  --pri:#45535f; --pri-ink:#ffffff; --pri-soft:#e6ebee;
  --acc:#9fd3db; --acc2:#5eb0be; --acc-soft:#e5f4f6; --acc-ink:#2b6f7b;
  --now:#e07a5f; --now-glow:rgba(224,122,95,.35); --sel:#6c7f8c;
  --me:rgba(159,211,219,.14); --wkend:rgba(69,83,95,.028); --todaycol:rgba(224,122,95,.06); --selcol:rgba(69,83,95,.05);
  --out-bg:#e9eef1; --out-line:#aebcc5; --out-ink:#4a5b67; --out-hatch:rgba(69,83,95,.11);
  --rc:rgba(69,83,95,.22); --grad:#dd8a66; --ms:#f2d064; --ms-line:rgba(70,55,10,.55);
  --time-bg:#e5f4f6; --time-ink:#2b6f7b;
  --shadow-sm:0 1px 2px rgba(25,40,50,.05);
  --shadow:0 1px 2px rgba(25,40,50,.04),0 8px 28px rgba(25,40,50,.06);
  --shadow-lg:0 24px 70px rgba(25,40,50,.20);
  --scrim:rgba(30,42,52,.28);
  /* phases: slate / teal family, one soft complementary (peach) for the M-days */
  --ph-RCV:#d3dbe0; --pt-RCV:#33414c;
  --ph-FORM:#c2ccd3; --pt-FORM:#2c3842;
  --ph-TRN:#acd8df; --pt-TRN:#1b3d45;
  --ph-MCWST:#62b2c1; --pt-MCWST:#0c2c33;
  --ph-TEAM:#9eaccb; --pt-TEAM:#1e2942;
  --ph-GRASS:#86c7ae; --pt-GRASS:#14362a;
  --ph-TBL1:#6195ae; --pt-TBL1:#ffffff;
  --ph-TBL2:#456579; --pt-TBL2:#ffffff;
  --ph-BWT:#7b8a98; --pt-BWT:#ffffff;
  --ph-CRUX:#2f3d48; --pt-CRUX:#ffffff;
  --ph-MPH:#ebb99d; --pt-MPH:#55291a;
  /* event highlight chips (poster meanings, softened) */
  --hY:#fbefb8; --hYt:#6a5200; --dY:#e9c43c;
  --hO:#e8ebd2; --hOt:#4b5220; --dO:#b4bc6c;
  --hG:#d8efd6; --hGt:#245028; --dG:#74c27a;
  --hT:#d3efed; --hTt:#1c5955; --dT:#45bcb2;
  --hC:#d5f0f7; --hCt:#155466; --dC:#46bfdc;
  --hB:#dee6fa; --hBt:#294a8e; --dB:#7f9ff0;
  --hR:#f8dcd7; --hRt:#7d2a1f; --dR:#e2786a;
  --hS:#e8ebed; --hSt:#48525a; --dS:#a9b2b9;
  --lw:176px; --axh:54px;
}
/* ============ tokens: dark ============ */
:root[data-theme="dark"]{
  --bg:#070a12; --surface:#0e1320; --surface2:#131a2a; --surface3:#182033;
  --ink:#e8ecf4; --ink2:#c3cada; --muted:#7a859b; --line:#182033; --line2:#232c42;
  --pri:#2f6bff; --pri-ink:#ffffff; --pri-soft:rgba(47,107,255,.14);
  --acc:#2f6bff; --acc2:#5b9dff; --acc-soft:rgba(47,107,255,.14); --acc-ink:#9dbdff;
  --now:#4f8dff; --now-glow:rgba(79,141,255,.55); --sel:#8b95ab;
  --me:rgba(47,107,255,.07); --wkend:rgba(255,255,255,.018); --todaycol:rgba(79,141,255,.08); --selcol:rgba(255,255,255,.035);
  --out-bg:#0b1019; --out-line:#2a3550; --out-ink:#8792a8; --out-hatch:rgba(255,255,255,.035);
  --rc:rgba(160,180,220,.16); --grad:#a9c4ff; --ms:#fde68a; --ms-line:rgba(0,0,0,.6);
  --time-bg:rgba(47,107,255,.16); --time-ink:#9dbdff;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 0 rgba(255,255,255,.02) inset,0 10px 30px rgba(0,0,0,.35);
  --shadow-lg:0 24px 70px rgba(0,0,0,.6);
  --scrim:rgba(0,0,0,.55);
  --ph-RCV:#1a2235; --pt-RCV:#c3cada;
  --ph-FORM:#222a3d; --pt-FORM:#c3cbdc;
  --ph-TRN:#1b2a4a; --pt-TRN:#c3d1f0;
  --ph-MCWST:#165b8a; --pt-MCWST:#e6f3ff;
  --ph-TEAM:#2d3b7a; --pt-TEAM:#e1e7ff;
  --ph-GRASS:#1d6a74; --pt-GRASS:#e0f6f7;
  --ph-TBL1:#2b4bb0; --pt-TBL1:#ffffff;
  --ph-TBL2:#3d5fd0; --pt-TBL2:#ffffff;
  --ph-BWT:#374159; --pt-BWT:#e2e7f2;
  --ph-CRUX:#2f6bff; --pt-CRUX:#ffffff;
  --ph-MPH:#4a40ad; --pt-MPH:#ffffff;
  --hY:rgba(250,204,21,.16); --hYt:#fde68a; --dY:#facc15;
  --hO:rgba(190,200,120,.15); --hOt:#e0e6a8; --dO:#b9c36a;
  --hG:rgba(74,222,128,.14); --hGt:#a7f3c0; --dG:#4ade80;
  --hT:rgba(45,212,191,.14); --hTt:#99f6e4; --dT:#2dd4bf;
  --hC:rgba(34,211,238,.14); --hCt:#a5f3fc; --dC:#22d3ee;
  --hB:rgba(96,165,250,.17); --hBt:#bfdbfe; --dB:#60a5fa;
  --hR:rgba(248,113,113,.16); --hRt:#fecaca; --dR:#f87171;
  --hS:rgba(148,163,184,.16); --hSt:#e2e8f0; --dS:#94a3b8;
}
.p-RCV{--pc:var(--ph-RCV);--pt:var(--pt-RCV)} .p-FORM{--pc:var(--ph-FORM);--pt:var(--pt-FORM)}
.p-TRN{--pc:var(--ph-TRN);--pt:var(--pt-TRN)} .p-MCWST{--pc:var(--ph-MCWST);--pt:var(--pt-MCWST)}
.p-TEAM{--pc:var(--ph-TEAM);--pt:var(--pt-TEAM)} .p-GRASS{--pc:var(--ph-GRASS);--pt:var(--pt-GRASS)}
.p-TBL1{--pc:var(--ph-TBL1);--pt:var(--pt-TBL1)} .p-TBL2{--pc:var(--ph-TBL2);--pt:var(--pt-TBL2)}
.p-BWT{--pc:var(--ph-BWT);--pt:var(--pt-BWT)} .p-CRUX{--pc:var(--ph-CRUX);--pt:var(--pt-CRUX)}
.p-MPH{--pc:var(--ph-MPH);--pt:var(--pt-MPH)}
.hl{border-radius:5px;padding:1px 5px;font-weight:500}
.hl-Y{background:var(--hY);color:var(--hYt)} .hl-O{background:var(--hO);color:var(--hOt)}
.hl-G{background:var(--hG);color:var(--hGt)} .hl-T{background:var(--hT);color:var(--hTt)}
.hl-C{background:var(--hC);color:var(--hCt)} .hl-B{background:var(--hB);color:var(--hBt)}
.hl-R{background:var(--hR);color:var(--hRt)} .hl-S{background:var(--hS);color:var(--hSt)}
.dt-Y{background:var(--dY)}.dt-O{background:var(--dO)}.dt-G{background:var(--dG)}.dt-T{background:var(--dT)}
.dt-C{background:var(--dC)}.dt-B{background:var(--dB)}.dt-R{background:var(--dR)}.dt-S{background:var(--dS)}

/* ============ base ============ */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f);display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;font-feature-settings:"tnum" 1,"cv11" 1}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.dlk{cursor:pointer;border-radius:4px;text-decoration:underline;text-decoration-style:dotted;text-decoration-color:color-mix(in srgb,currentColor 45%,transparent);text-underline-offset:3px;pointer-events:auto}
.dlk:hover{color:var(--acc-ink);text-decoration-color:currentColor;background:var(--acc-soft)}
.dlk:focus-visible,button:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}

/* ============ header ============ */
.hdr{flex:none;display:flex;align-items:center;gap:14px;padding:14px 20px 10px;padding-top:max(14px,env(safe-area-inset-top));padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:var(--pri);display:grid;place-items:center;flex:none;box-shadow:var(--shadow-sm)}
.t1{font-weight:700;font-size:19px;letter-spacing:-.01em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-s{display:none}
.clock{margin-left:auto;display:flex;align-items:center;gap:10px}
.clk{border:0;background:transparent;text-align:right;line-height:1.15;cursor:pointer;padding:4px 8px;border-radius:10px}
.clk:hover{background:var(--surface)}
.clk-d{font-size:12px;color:var(--muted);font-weight:500}
.clk-t{font-weight:650;font-size:20px;letter-spacing:-.01em}
.clk-t small{font-size:11.5px;color:var(--muted);font-weight:500;margin-left:4px}
.live{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:999px;padding:8px 13px;font-weight:600;font-size:12px;background:var(--surface);box-shadow:var(--shadow-sm);cursor:pointer;white-space:nowrap;color:var(--ink2)}
.live i{width:7px;height:7px;border-radius:50%;background:#3fbf7f;animation:pulse 2.2s infinite}
.live.away i{background:var(--now);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,191,127,.5)}70%{box-shadow:0 0 0 7px rgba(63,191,127,0)}100%{box-shadow:0 0 0 0 rgba(63,191,127,0)}}
.hbtn{width:38px;height:38px;border-radius:12px;border:0;background:var(--surface);box-shadow:var(--shadow-sm);color:var(--ink2);display:grid;place-items:center;cursor:pointer}
.hbtn:hover{color:var(--ink)}

/* ============ summary ============ */
.sum{flex:none;display:flex;gap:10px;overflow-x:auto;padding:4px 20px 12px;scrollbar-width:none}
.sum::-webkit-scrollbar{display:none}
.sc{flex:none;display:flex;align-items:center;gap:11px;padding:10px 14px 10px 12px;border:0;border-radius:14px;background:var(--surface);box-shadow:var(--shadow-sm);cursor:pointer;white-space:nowrap;text-align:left;transition:box-shadow .2s,transform .2s}
.sc:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.sc .k{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.sc .v{display:block;font-weight:600;font-size:14px;line-height:1.3}
.sc .v em{font-style:normal;color:var(--muted);font-weight:500}
.sc.mine{box-shadow:inset 0 0 0 1.5px var(--acc),var(--shadow-sm)}
.sc.sel{box-shadow:inset 0 0 0 1.5px var(--sel),var(--shadow-sm)}
.sc .x{margin-left:4px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface3);font-size:11px;color:var(--muted)}
.sc .x:hover{color:var(--ink)}

/* ============ toolbar ============ */
.tb{flex:none;display:flex;align-items:center;gap:8px;padding:0 20px 12px;flex-wrap:wrap;position:relative;z-index:25}
.seg{display:inline-flex;background:var(--surface);box-shadow:var(--shadow-sm);border-radius:12px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 15px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;transition:background .2s,color .2s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--pri);color:var(--pri-ink)}
.btn{border:0;background:var(--surface);box-shadow:var(--shadow-sm);border-radius:11px;padding:0 13px;min-height:38px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;color:var(--ink2);transition:color .15s,box-shadow .15s}
.btn:hover{color:var(--ink);box-shadow:var(--shadow)}
.btn.pri{background:var(--pri);color:var(--pri-ink)}
.btn.soft{background:var(--acc-soft);color:var(--acc-ink);box-shadow:none}
.btn.ic{width:38px;padding:0;font-size:17px}
.grp{display:inline-flex;align-items:center;gap:6px}
.sep{width:1px;height:22px;background:var(--line2);margin:0 4px}
.zoom input[type=range]{width:120px;accent-color:var(--pri)}
.date{border:0;background:var(--surface);box-shadow:var(--shadow-sm);border-radius:11px;min-height:38px;padding:0 11px;font:500 13px var(--f);color:var(--ink);color-scheme:light}
:root[data-theme="dark"] .date{color-scheme:dark}
.cos{display:flex;gap:4px;align-items:center;flex-wrap:wrap;background:var(--surface);box-shadow:var(--shadow-sm);border-radius:12px;padding:4px}
.cchip{width:28px;height:28px;border-radius:8px;border:0;font-weight:600;font-size:12.5px;background:transparent;cursor:pointer;color:var(--muted);padding:0;transition:all .15s}
.cchip:hover{background:var(--surface3);color:var(--ink)}
.cchip.on{background:var(--pri-soft);color:var(--ink)}
.cchip.me{box-shadow:inset 0 0 0 1.5px var(--acc2)}
.cchip.me.on{background:var(--acc);color:#16323a}
:root[data-theme="dark"] .cchip.me.on{color:#fff}
.tb .push{margin-left:auto}

/* ============ timeline card ============ */
.card{flex:1;min-height:0;margin:0 20px 18px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden;position:relative;display:flex}
.vp{flex:1;min-width:0;overflow:auto;position:relative;touch-action:pan-x pan-y;overscroll-behavior:contain;background:var(--surface)}
.vp.drag{cursor:grabbing;user-select:none}
#content{position:relative;min-height:100%}
.axr{position:sticky;top:0;z-index:20;display:flex;height:var(--axh);background:var(--surface);border-bottom:1px solid var(--line)}
.corner{position:sticky;left:0;z-index:22;width:var(--lw);flex:none;background:var(--surface);display:flex;flex-direction:column;justify-content:flex-end;padding:0 16px 9px;font-size:11.5px;color:var(--muted);font-weight:500}
.corner b{color:var(--ink2);font-weight:600;font-size:12.5px}
#axTrk{position:relative;flex:none;height:100%;overflow:hidden}
.mo{position:absolute;top:0;height:26px;padding:7px 7px 0;font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;cursor:pointer;color:var(--ink2);border-left:1px solid var(--line)}
.mo:hover{color:var(--ink);background:var(--surface2)}
.mo.jan{border-left:1.5px solid var(--line2)}
.mo .fy{display:inline-block;margin-left:7px;padding:1px 7px;border-radius:6px;background:var(--acc-soft);color:var(--acc-ink);font-size:10.5px;font-weight:600}
.dy{position:absolute;top:27px;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;font-size:12.5px;line-height:1.05;color:var(--ink2);cursor:pointer}
.dy small{font-size:10px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.dy:hover{background:var(--surface2);color:var(--ink)}
.dy.we{color:var(--muted)}
.dy.td{color:var(--now)}
.dy.td small{color:var(--now)}
.wkt{position:absolute;top:27px;bottom:0;padding:8px 0 0 5px;font-size:11.5px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden;border-left:1px solid var(--line)}
.wkt:hover{color:var(--ink);background:var(--surface2)}
#nowChip,#selChip{position:absolute;transform:translateX(-50%);font-weight:600;font-size:11px;line-height:1;padding:5px 9px;border-radius:999px;white-space:nowrap;z-index:3;cursor:pointer}
#nowChip{background:var(--now);color:#fff;box-shadow:0 4px 14px var(--now-glow)}
#selChip{background:var(--sel);color:#fff;bottom:4px}

#grid{position:absolute;left:var(--lw);z-index:0;pointer-events:none;overflow:hidden}
#grid .wk{position:absolute;top:0;bottom:0;background:var(--wkend)}
#grid .vl{position:absolute;top:0;bottom:0;width:1px;background:var(--line);opacity:.7}
#grid .ml{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
#grid .ml.jan{background:var(--line2)}
#grid .tc{position:absolute;top:0;bottom:0;background:var(--todaycol)}
#grid .scol{position:absolute;top:0;bottom:0;background:var(--selcol)}
#grid .days{position:absolute;inset:0;opacity:.6}

.lane{display:flex;position:relative;border-bottom:1px solid var(--line)}
.lane:last-child{border-bottom:0}
.lane.me{background:var(--me)}
.lab{position:sticky;left:0;z-index:10;width:var(--lw);flex:none;background:var(--surface);display:flex;align-items:center;gap:11px;padding:0 12px 0 16px;cursor:pointer;overflow:hidden;box-shadow:1px 0 0 var(--line)}
.lab:hover .ln{color:var(--acc-ink)}
.lane.me .lab{background:linear-gradient(90deg,var(--acc-soft),var(--surface) 90%)}
.pk{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--pri-soft);color:var(--ink);font-weight:700;font-size:13.5px;line-height:1;flex:none}
.pk.me{background:var(--acc);color:#16323a}
:root[data-theme="dark"] .pk.me{color:#fff}
.pk.sm{width:22px;height:22px;font-size:11.5px;border-radius:7px}
.pk.lg{width:46px;height:46px;font-size:21px;border-radius:14px}
.lt{display:flex;flex-direction:column;min-width:0;flex:1;gap:2px}
.ln{font-weight:600;font-size:14px;line-height:1.15;transition:color .15s}
.ls{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
.lid{font-weight:600;font-size:11.5px;line-height:1;color:var(--ink2);background:var(--surface3);border-radius:6px;padding:4px 6px}
.lid.st-out{background:repeating-linear-gradient(135deg,var(--out-hatch) 0 3px,transparent 3px 6px),var(--out-bg);color:var(--out-ink);box-shadow:inset 0 0 0 1px var(--out-line)}
.lid.st-rcv{background:var(--surface3)}
.lsub{overflow:hidden;text-overflow:ellipsis}
.lpg{height:3px;border-radius:3px;background:var(--surface3);overflow:hidden;margin-top:4px}
.lpg i{display:block;height:100%;background:var(--acc2);border-radius:3px}
.lane.short .lpg,.lane.short .lsub{display:none}

.trk{position:relative;flex:none;height:100%}
.bar{position:absolute;border-radius:7px;overflow:hidden;cursor:pointer;transition:filter .15s,box-shadow .15s,opacity .15s}
.bar:hover{box-shadow:0 4px 14px rgba(0,0,0,.14);filter:brightness(1.03)}
.bar.past{opacity:.5}
.bar.past:hover{opacity:.75}
.bar.strip{border-radius:3px}
.sg{position:absolute;top:0;bottom:0;background:var(--pc);color:var(--pt);font-weight:600;font-size:11.5px;line-height:1;display:flex;align-items:center;padding-left:7px;white-space:nowrap;overflow:hidden}
.sg+.sg{box-shadow:inset 1px 0 0 color-mix(in srgb,var(--surface) 55%,transparent)}
.rcv{position:absolute;border-radius:7px 0 0 7px;background:repeating-linear-gradient(135deg,var(--rc) 0 2px,transparent 2px 6px);pointer-events:none}
/* outpost: the gap between graduation and the next pickup */
.opb{position:absolute;border-radius:8px;background:repeating-linear-gradient(135deg,var(--out-hatch) 0 4px,transparent 4px 9px),var(--out-bg);box-shadow:inset 0 0 0 1px var(--out-line);color:var(--out-ink);display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:0 10px;white-space:nowrap;overflow:hidden;cursor:pointer;font-size:11.5px;transition:box-shadow .15s}
.opb:hover{box-shadow:inset 0 0 0 1.5px var(--acc2)}
.opb .ot{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:10.5px}
.opb .os{font-weight:500}
.opb.big{flex-direction:column;justify-content:center;align-items:center;gap:4px;border-radius:10px}
.opb.big .ot{font-size:12px;letter-spacing:.14em}
.opb.big .os{font-size:12.5px}
.gs{position:absolute;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:9px;line-height:1;box-shadow:0 0 0 2px var(--surface);pointer-events:none;z-index:1}
.ms{position:absolute;width:7px;height:7px;background:var(--ms);transform:rotate(45deg);box-shadow:0 0 0 1px var(--ms-line);pointer-events:none;border-radius:1px}
.cap{position:absolute;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.cap b{color:var(--ink);font-weight:600}

/* day cells */
.dc{position:absolute;border-radius:9px;background:color-mix(in srgb,var(--pc) 20%,var(--surface));padding:5px 7px;overflow:hidden;cursor:pointer;font-size:12px;line-height:1.3;transition:box-shadow .15s,transform .15s}
.dc::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--pc)}
.dc:hover{box-shadow:var(--shadow);transform:translateY(-1px);z-index:2}
.dc.td{box-shadow:0 0 0 2px var(--now),0 6px 18px var(--now-glow)}
.dc.sl{box-shadow:0 0 0 2px var(--sel)}
.dc.past{opacity:.55}
.dc.nr{padding:6px 1px 4px;text-align:center}
.dc.nr .id{font-size:12px;letter-spacing:-.01em}
.dc.nr .dots{justify-content:center}
.dc .hd{display:flex;align-items:baseline;justify-content:space-between;gap:4px}
.dc .id{font-weight:700;font-size:13.5px;line-height:1.2}
.dc .bd{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc .it{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.dc .more{display:block;margin-top:3px;font-size:11px;color:var(--muted);font-weight:600}
.dc .dots{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.dc .dots i{width:6px;height:6px;border-radius:50%;display:block}
.dc.crux{background:var(--pc);color:var(--pt)}
.dc.crux .bd,.dc.crux .id{color:var(--pt)}
.dc.grad{background:color-mix(in srgb,var(--grad) 32%,var(--surface))}
.dc.grad::before{background:var(--grad)}
.dc.rcvc{background:repeating-linear-gradient(135deg,var(--rc) 0 2px,transparent 2px 7px),var(--surface2)}
.dc.rcvc::before{background:var(--line2)}
.dc .big{font-weight:700;font-size:14px;letter-spacing:.08em;margin-top:8px;display:block}
.tm{font-style:normal;font-size:10.5px;font-weight:500;line-height:1;background:var(--time-bg);color:var(--time-ink);border-radius:999px;padding:2px 6px;margin-left:4px;white-space:nowrap}
.dc.crux .tm{background:color-mix(in srgb,var(--pt) 18%,transparent);color:var(--pt)}

#nowLine{position:absolute;width:2px;margin-left:-1px;background:var(--now);z-index:8;pointer-events:none;box-shadow:0 0 12px var(--now-glow);border-radius:2px}
#nowLine::before{content:"";position:absolute;top:-1px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--now);box-shadow:0 0 0 4px color-mix(in srgb,var(--now) 22%,transparent)}
#nowLine.dt{opacity:.8}
#selLine{position:absolute;width:0;margin-left:-1px;border-left:2px dashed var(--sel);z-index:7;pointer-events:none;opacity:.8}

/* ============ floating ============ */
.jump{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translate(-50%,24px);opacity:0;pointer-events:none;transition:all .25s cubic-bezier(.2,.8,.2,1);z-index:40;background:var(--pri);color:var(--pri-ink);border:0;border-radius:999px;padding:11px 18px;font-weight:600;font-size:13px;box-shadow:var(--shadow-lg);cursor:pointer}
.jump.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.zfab{position:fixed;right:calc(28px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom));display:none;flex-direction:column;gap:8px;z-index:40}
.zfab button{width:42px;height:42px;border-radius:13px;border:0;background:var(--surface);box-shadow:var(--shadow-lg);font-size:20px;line-height:1;display:grid;place-items:center;cursor:pointer;color:var(--ink2)}
.keyfab{position:fixed;left:calc(28px + env(safe-area-inset-left));bottom:calc(30px + env(safe-area-inset-bottom));z-index:45;border:0;border-radius:13px;background:var(--surface);color:var(--ink2);box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;padding:0 14px 0 11px;height:42px;font-weight:600;font-size:13px;cursor:pointer}
.keyfab:hover,.keyfab.on{color:var(--ink)}
.keyfab.on{background:var(--pri);color:var(--pri-ink)}
.keyfly{position:fixed;left:calc(28px + env(safe-area-inset-left));bottom:calc(82px + env(safe-area-inset-bottom));z-index:46;width:min(360px,calc(100vw - 32px));max-height:min(70vh,640px);overflow:auto;background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);padding:16px 18px 18px;transform-origin:bottom left;transform:translateY(10px) scale(.97);opacity:0;pointer-events:none;transition:all .2s cubic-bezier(.2,.8,.2,1)}
.keyfly.open{transform:none;opacity:1;pointer-events:auto}
.keyfly h5{margin:14px 0 8px;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.keyfly h5:first-child{margin-top:0}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px 14px;font-size:13px}
.krow{display:flex;align-items:center;gap:9px;min-width:0}
.ksym{flex:none;width:26px;height:14px;display:grid;place-items:center;position:relative}
.ksw{width:22px;height:12px;border-radius:4px;background:var(--pc)}
.kfoot{margin-top:14px;font-size:12px;color:var(--muted);line-height:1.5}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.45;max-width:300px;box-shadow:var(--shadow-lg);opacity:0;transition:opacity .12s}
.tip.show{opacity:1}
.tip b{font-weight:650}
.tip .tg{color:var(--muted);font-size:11.5px}

/* ============ sheet ============ */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .22s;z-index:100;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,calc(100% + 30px));width:min(860px,100%);max-height:86vh;max-height:86dvh;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:var(--shadow-lg);z-index:101;display:flex;flex-direction:column;transition:transform .32s cubic-bezier(.2,.85,.2,1);visibility:hidden}
.sheet.open{transform:translate(-50%,0);visibility:visible}
@media (min-width:900px){.sheet{bottom:18px;border-radius:22px;max-height:min(80vh,840px)}}
.grab{width:40px;height:4px;border-radius:3px;background:var(--line2);margin:9px auto 0;flex:none}
.sh{flex:none;padding:12px 22px 14px;border-bottom:1px solid var(--line)}
.shr{display:flex;align-items:center;gap:12px}
.sht{font-weight:700;font-size:21px;letter-spacing:-.015em;line-height:1.2}
.shs{font-size:13px;color:var(--muted);margin-top:2px}
.sh .push{margin-left:auto;display:flex;gap:6px}
.sh .btn,.sb .btn{background:var(--surface2);box-shadow:none}

.sb{overflow:auto;padding:16px 22px 26px;padding-bottom:calc(26px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:14px;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:7px;border:0;background:var(--surface2);border-radius:10px;padding:5px 11px 5px 5px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--ink2)}
.tab:hover{background:var(--surface3)}
.tab.all{padding-left:11px}
.tab.on{background:var(--pri);color:var(--pri-ink)}
.tab.on .pk{background:color-mix(in srgb,var(--pri-ink) 22%,transparent);color:var(--pri-ink)}
h4{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:22px 0 10px;display:flex;align-items:center;gap:10px}
h4:first-child{margin-top:2px}
h4 .push{margin-left:auto;display:flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0}
.hero{display:flex;gap:16px;align-items:center;padding:16px 18px;border-radius:16px;background:color-mix(in srgb,var(--pc,var(--surface3)) 22%,var(--surface));position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pc,var(--line2))}
.hero.out{background:repeating-linear-gradient(135deg,var(--out-hatch) 0 4px,transparent 4px 9px),var(--out-bg);box-shadow:inset 0 0 0 1px var(--out-line)}
.hero.out::before{display:none}
.hid{font-weight:700;font-size:38px;line-height:1;letter-spacing:-.02em;min-width:76px;text-align:center}
.h1{font-weight:650;font-size:16px;line-height:1.25}
.h2{font-size:13.5px;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pp{display:inline-flex;align-items:center;background:var(--pc);color:var(--pt);font-weight:600;font-size:11.5px;line-height:1;border-radius:7px;padding:5px 8px}
.evl{display:flex;flex-direction:column}
.evr{display:flex;gap:12px;align-items:baseline;padding:9px 4px;border-bottom:1px solid var(--line)}
.evr:last-child{border-bottom:0}
.evr .tt{flex:none;width:96px;font-weight:600;font-size:12.5px;color:var(--time-ink)}
.evr .tt.na{color:var(--muted);font-weight:500}
.evr .te{flex:1;min-width:0}
.evr .te small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.evr.rt{opacity:.55}
.evr.now{background:color-mix(in srgb,var(--now) 9%,transparent);border-radius:10px;padding-left:10px;border-bottom-color:transparent}
.evr.now .tt::after{content:"Now";margin-left:6px;font-size:10px;font-weight:700;background:var(--now);color:#fff;border-radius:5px;padding:2px 6px}
.evr.past{opacity:.45}
.mini{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.mini button{border:0;background:transparent;border-radius:8px;padding:5px 11px;font-weight:600;font-size:12px;color:var(--muted);cursor:pointer}
.mini button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
:root[data-theme="dark"] .mini button.on{background:var(--pri);color:#fff}
.tog{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);cursor:pointer}
.tog input{accent-color:var(--pri);width:16px;height:16px}
.notes{margin:4px 0 0;padding-left:20px;color:var(--muted);font-size:13px}
.notes li{margin:3px 0}
.rrow{display:flex;width:100%;text-align:left;align-items:center;gap:12px;padding:11px 12px;border:0;border-radius:14px;background:var(--surface2);margin-bottom:8px;cursor:pointer;transition:background .15s}
.rrow:hover{background:var(--surface3)}
.rrow.me{box-shadow:inset 0 0 0 1.5px var(--acc)}
.rr{flex:1;min-width:0}
.rr1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rr1 b{font-weight:650;font-size:14.5px}
.rid{font-weight:700;font-size:13px;background:var(--surface);border-radius:7px;padding:2px 7px}
.rr2{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;font-size:12.5px}
.chev{color:var(--muted);font-size:20px}
.outs{display:flex;flex-wrap:wrap;gap:6px}
.oc{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:10px;padding:5px 11px 5px 5px;font-size:12.5px;cursor:pointer;background:repeating-linear-gradient(135deg,var(--out-hatch) 0 3px,transparent 3px 7px),var(--out-bg);box-shadow:inset 0 0 0 1px var(--out-line);color:var(--out-ink)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kvi{border:0;border-radius:14px;padding:11px 13px;background:var(--surface2);text-align:left;cursor:pointer;transition:background .15s,box-shadow .15s}
.kvi:hover{background:var(--surface3);box-shadow:inset 0 0 0 1.5px var(--acc)}
.kvi.na{cursor:default}
.kvi.na:hover{background:var(--surface2);box-shadow:none}
.kvi .k{font-size:11.5px;color:var(--muted);font-weight:500}
.kvi .v{font-weight:650;font-size:15.5px;line-height:1.3;margin-top:2px}
.kvi .v small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.kvi.out{background:repeating-linear-gradient(135deg,var(--out-hatch) 0 4px,transparent 4px 9px),var(--out-bg);box-shadow:inset 0 0 0 1px var(--out-line)}
.prog .pb{position:relative;height:12px;border-radius:7px;overflow:hidden;display:flex}
.prog .pb div{height:100%;background:var(--pc)}
.prog .pm{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--now);border-radius:2px;box-shadow:0 0 0 2px var(--surface)}
.prog .pt{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:7px}
.prog .big{font-weight:700;font-size:30px;line-height:1;letter-spacing:-.02em}
.msr{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.msr:hover{background:var(--surface2)}
.msr .md{flex:none;width:118px;font-weight:500;font-size:12.5px;color:var(--muted)}
.msr .mi{flex:none;font-weight:700;font-size:12px;background:var(--surface2);border-radius:6px;padding:3px 6px;min-width:42px;text-align:center}
.msr.done{opacity:.45}
.msr.next{background:color-mix(in srgb,var(--now) 8%,transparent)}
.msr.next:not(.tdy) .md::after{content:" · next";color:var(--now);font-weight:600}
.msr.tdy .md::after{content:" · today";color:var(--now);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.note{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:12px;padding:10px 12px;margin-top:10px}
.empty{color:var(--muted);padding:6px 2px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.pgrid .cchip{width:42px;height:42px;font-size:15px;border-radius:12px;background:var(--surface2)}
.pgrid .cchip.on{background:var(--pri);color:var(--pri-ink)}
.pgrid .cchip.me.on{background:var(--acc);color:#16323a}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sheet .date{background:var(--surface2);box-shadow:none}

/* ---- parity additions: holiday, planning, series, search, MPP block ---- */

.dc .it.w2{white-space:normal}

.dy.fh::after{content:"";position:absolute;bottom:2px;left:50%;margin-left:-3px;width:6px;height:6px;border-radius:50%;background:var(--holb)}
.bar.plan{opacity:.72;outline:1.5px dashed var(--muted);outline-offset:1px}

.hblk b{font-weight:700}
.hblk span{color:var(--muted)}
.hdr{position:relative;z-index:35}
.qwrap{position:relative;flex:0 1 340px;margin:0 auto;min-width:0}

.qbox input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:500 14px var(--f);color:var(--ink)}

.qbox:focus-within{box-shadow:0 0 0 2px var(--acc2)}

.qres{display:none;position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);width:min(500px,calc(100vw - 24px));max-height:min(64vh,560px);overflow:auto;background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);padding:10px;z-index:60}
.qres.on{display:block}
.qh{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--muted);padding:2px 6px 8px;font-weight:500}
.qchips{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px 4px}
.qchip{border:0;background:var(--surface2);color:var(--ink2);border-radius:999px;padding:6px 12px;font-weight:600;font-size:12.5px;cursor:pointer}
.qchip:hover{background:var(--surface3)}
.qg{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:10px 6px 4px}
.qr{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:10px;cursor:pointer}
.qr:hover{background:var(--surface2)}
.qr.past{opacity:.5}
.qr .qt{flex:1;min-width:0;font-weight:600;font-size:13.5px}
.qr .qd{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:1px}
.qr .go{color:var(--muted);font-size:18px}
.qnone{padding:10px 6px;color:var(--muted);font-size:13px}
.qmore{display:block;width:100%;border:0;background:var(--surface2);color:var(--ink2);border-radius:10px;padding:9px;margin-top:8px;font-weight:600;font-size:12.5px;cursor:pointer}

  .hdr{flex-wrap:wrap}

.coach::before{content:"";position:absolute;width:14px;height:14px;background:inherit;transform:rotate(45deg);left:var(--ax);margin-left:-7px}
.coach.dn::before{top:-7px;box-shadow:-1px -1px 0 var(--line2)}
.coach.up::before{bottom:-7px;box-shadow:1px 1px 0 var(--line2)}

.cmask{position:fixed;inset:0;z-index:199;pointer-events:none;animation:cFade .3s}

/* ---- holidays: every federal holiday (actual + observed day) plus the days
   the MPP shades green ("impacted by holiday period") per company ---- */
const FED=new Map();                         /* day index -> holiday name */
(function(){
  const nth=(y,m,wd,n)=>{const d=new Date(y,m,1);d.setDate(1+((wd-d.getDay()+7)%7)+7*(n-1));return d;};
  const lastMon=(y,m)=>{const d=new Date(y,m+1,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d;};
  const put=(d,n)=>{const k=dIdx(d);if(!FED.has(k))FED.set(k,n);};
  const add=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
  const fixed=(y,m,dd,n)=>{const d=new Date(y,m,dd);put(d,n);
    if(d.getDay()===6)put(add(d,-1),n+" (observed)");
    if(d.getDay()===0)put(add(d,1),n+" (observed)");};
  for(let y=2024;y<=2031;y++){
    fixed(y,0,1,"New Year's Day");
    put(nth(y,0,1,3),"Martin Luther King Jr. Day");
    put(nth(y,1,1,3),"Presidents Day");
    put(lastMon(y,4),"Memorial Day");
    fixed(y,5,19,"Juneteenth");
    fixed(y,6,4,"Independence Day");
    put(nth(y,8,1,1),"Labor Day");
    put(nth(y,9,1,2),"Columbus Day");
    fixed(y,10,11,"Veterans Day");
    put(nth(y,10,4,4),"Thanksgiving Day");
    fixed(y,11,25,"Christmas Day");
  }
})();
function holOf(c,i){

function holRuns(c){
  if(c._hr) return c._hr;
  const out=[];let cur=null;
  for(let i=c.shipi;i<=c.gradi;i++){const n=holOf(c,i);
    if(n){ if(!cur){cur={a:i,b:i,names:[]};out.push(cur);} cur.b=i; if(!cur.names.includes(n))cur.names.push(n); }

}

  const f1=P(c.pickup);
  let s=(7-((f1.getDay()+6)%7))%7; if(s===0) s=7;          /* days F1 -> next Monday */
  const f1i=dIdx(f1), wk1=f1i+s, map=new Map();
  map.set(f1i,0); map.set(wk1-1,1);
  for(let i=2;i<SEQ.length;i++) map.set(wk1+i-2,i);
  const inv=[];map.forEach((si,di)=>{inv[si]=di;});
  const o={...c,k,f1i,wk1,map,inv,shipi:pI(c.ship),td1i:pI(c.td1),gradi:pI(c.grad)};
  o.holSet=new Set((c.hol||[]).map(pI));
  /* MPP phase dates (authoritative for the phase bars) */
  const R=a=>[pI(a[0]),pI(a[1])];
  o.mp={GRASS:R(c.ph.grass),TBL1:R(c.ph.t1),TBL2:R(c.ph.t2),BWT:R(c.ph.bwt),CRUX:R(c.ph.crux),rap:pI(c.ph.rap)};
  o.nomGrad=wk1+M12-2; o.compressed=o.gradi<o.nomGrad;
  /* phase for the bars: MPP dates first; everything else by standard counting */
  o.ph=i=>{
    const m=o.mp;
    if(i>=m.CRUX[0]&&i<=m.CRUX[1]) return "CRUX";
    if(i>m.CRUX[1]) return "MPH";
    for(const k2 of ["GRASS","TBL1","TBL2","BWT"]) if(i>=m[k2][0]&&i<=m[k2][1]) return k2;
    const si=map.get(i), k2=si==null?"FORM":SEQPH[si];
    return (MPPSET[k2]||k2==="MPH")?"TRN":k2;
  };
  /* phase segments F1..grad */
  o.segs=[];let cur=null;
  for(let i=f1i;i<=o.gradi;i++){const k2=o.ph(i);if(cur&&cur.k===k2)cur.b=i;else{cur={a:i,b:i,k:k2};o.segs.push(cur);}}
  /* milestones (yellow quals + EGA) */
  o.ms=[];
  for(let i=f1i;i<=o.gradi;i++){const si=map.get(i);if(si==null)continue;const cell=SEQ[si];
    const ys=cell.items.map(parseItem).filter(x=>x&&x.k==="Y").map(x=>x.t);

  o.ms.sort((a,b)=>a.i-b.i);
  o.ms.push({i:o.gradi,si:map.get(o.gradi),names:["Graduation"],kind:"GRAD"});
  return o;
});

function stateAt(co,i){
  let prev=null,next=null;
  for(const c of BYCO[co]){
    if(i>=c.shipi&&i<c.f1i) return{st:"rcv",cyc:c};
    if(i>=c.f1i&&i<=c.gradi) return{st:"in",cyc:c,si:c.map.get(i)};
    if(c.gradi<i) prev=c; else if(!next&&c.shipi>i) next=c;
  }
  return{st:"out",prev,next};
}
function info(co,i){
  const s=stateAt(co,i);
  if(s.st==="in"){const c=s.cyc,si=s.si,k=c.ph(i);
    return{...s,id:si!=null?SEQ[si].id:"FORM",wk:si!=null?SEQ[si].wk:"F",k,sub:PH[k].s,pct:(i-c.f1i)/(c.gradi-c.f1i),dtg:c.gradi-i};}
  if(s.st==="rcv") return{...s,id:"RCV",k:"RCV",sub:"Receiving · F1 "+fD(s.cyc.f1i)};
  return{...s,id:"OUT",sub:s.next?"Outpost · F1 "+fD(s.next.f1i):"Outpost"};
}

const SPLIT=new Set(DATA.split||[]);

const oth=(t,dim)=>{if(!dim)return false;const m=SER_RE.exec(t||"");return !!m&&m[1]!==SER;};
/* both series' times on one line; the timeline cells always use this, so the
   timeline never changes when Lead/Follow is toggled */
function tmBoth(cl){
  const tm=cl.tm||{};
  if(!cl.tf) return tm;
  if(cl._both) return cl._both;
  const o={};
  new Set(Object.keys(tm).concat(Object.keys(cl.tf))).forEach(k=>{
    const a=tm[k], b=cl.tf[k];
    o[k]=(a===b)?a:((a?"L "+a:"")+(a&&b?" · ":"")+(b?"F "+b:""));
  });
  cl._both=o; return o;
}

function tmOf(cl){

  return tmBoth(cl);
}
const serPair=()=>`<span class="serpair"><button class="serbtn ${SER==="L"?"on":""}" data-ser="L">Lead</button><button class="serbtn ${SER==="F"?"on":""}" data-ser="F">Follow</button></span>`;
/* one events list per day: Matrix lines + header tag + the Crucible,
   sorted by start time; untimed last in Matrix order; other series last */
function dayEvents(cl){
  const dim=isSplit(cl), tmap=tmOf(cl), out=[];
  const add=(raw,k)=>{
    if(!raw) return;
    let label=raw, color=null;
    if(raw[0]==="*"){ const p=raw.slice(1).split("|"); label=p[0]; color=p[1]; }
    else if(k==="tag"){ const p=raw.split("|"); label=p[0]; color=p[1]||null; }
    const o=oth(raw,dim), tm=o?null:(tmap[k]||null);
    const m=tm&&/(\d{4})/.exec(tm);
    out.push({label,color,tm,o,span:k==="span",key:m?+m[1]:9999,ord:out.length});
  };
  if(cl.tag) add(cl.tag,"tag");
  cl.items.forEach((t,ix)=>add(t,String(ix)));
  if(cl.span) add(cl.span.charAt(0)+cl.span.slice(1).toLowerCase(),"span");
  out.sort((a,b)=>(a.key-b.key)||(a.ord-b.ord));
  return out;
}

}

function cellItems(si,times){

const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function zoomTo(target,fIdx,endT,anim=true,done){
  target=clamp(target,ppdOv,PMAX);
  const p0=ppd, tw=trackW();
  const startT=clamp(X(fIdx+.5)-vp.scrollLeft,0,tw);
  if(endT==null) endT=startT;
  const apply=e=>{ppd=p0*Math.pow(target/p0,e);render(false);vp.scrollLeft=(fIdx+.5)*ppd-(startT+(endT-startT)*e);};
  if(!anim||Math.abs(Math.log(target/p0))<.01){animating=false;apply(1);render(true);vp.scrollLeft=(fIdx+.5)*ppd-endT;if(done)done();return;}
  animating=true;const t0=performance.now(),D=320;
  const step=t=>{const e=ease(Math.min(1,(t-t0)/D));apply(e);if(e<1)requestAnimationFrame(step);else{animating=false;render(true);vp.scrollLeft=(fIdx+.5)*ppd-endT;renderDetail(true);stickCaps();stickOut();updateJump();if(done)done();}};
  requestAnimationFrame(step);
}
function centerIdx(){return (vp.scrollLeft+trackW()/2)/ppd-.5;}
function setView(v){

  const endT=v==="ov"?(f+.5-ovStart(f))*target:(v==="wk"?Math.min(tw*.3,target*1.6):tw*.36);
  zoomTo(target,f,endT,true,()=>{if(v!=="ov"&&follow)ensureLane(S.my);});
}
function zoomBy(f,clientX){

}

/* live, light-weight zoom for wheel and pinch */
let pend=null,idleT=null;
function liveZoom(newP,idx,t){
  ppd=clamp(newP,ppdOv,PMAX);
  if(!pend) pend=requestAnimationFrame(()=>{pend=null;animating=true;render(false);vp.scrollLeft=(idx+.5)*ppd-t;});
  clearTimeout(idleT);idleT=setTimeout(()=>{animating=false;render(true);vp.scrollLeft=(idx+.5)*ppd-t;renderDetail(true);},140);
}

    const r=vp.getBoundingClientRect(),t=clamp(e.clientX-r.left-LW,0,trackW());
    if(!wz||performance.now()-wz.ts>200) wz={idx:(vp.scrollLeft+t)/ppd-.5,t};
    wz.ts=performance.now();

},{passive:true});
vp.addEventListener("touchmove",e=>{

    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);liveZoom(pinch.p0*d/pinch.d0,pinch.idx,pinch.t);}

const prepQ=x=>String(x||"").toLowerCase().replace(/m\W*16/g,"m16")
  .replace(/h\W*cuts?\b/g,"haircuts").replace(/hair\s*cuts?/g,"haircuts")
  .replace(/[^a-z0-9]+/g," ").trim();
const ALIAS={crux:["crucible"],grad:["graduation"],hc:["haircuts"],cuts:["haircuts"],
  rifle:["table"],range:["table"],shooting:["table"],swim:["water","mcwst"],
  shots:["inoculations"],shot:["inoculations"],vaccine:["inoculations"],
  church:["religious"],chapel:["religious"],pics:["photos","photo"],
  pictures:["photos","photo"],picture:["photos","photo"],ega:["emblem"],
  eagle:["emblem"],test:["exam","testing"],uniform:["clothing"],
  uniforms:["clothing"],fitting:["clothing"],libo:["liberty"],bank:["nfcu"],
  px:["mcx"],exchange:["mcx"],hump:["hike"],dentist:["dental"],tower:["rappel"],
  ocourse:["o"],confidence:["confidence"],family:["family","fam"],
  one:["1","one"],two:["2","two"],"1":["1","one","i"],"2":["2","two","ii"],
  written:["written","wr","wrt"],obstacle:["o"],fast:["fast"],pt:["pt","physical"]};
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let p=[]; for(let j=0;j<=n;j++) p[j]=j;
  for(let i=1;i<=m;i++){ const c=[i];
    for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));
    p=c; }
  return p[n];
}
function wordScore(t,w){
  if(t===w) return 4;
  if(/^\d+$/.test(t)) return 0;                 /* numbers must match exactly */
  if(t.length>=2&&w.startsWith(t)) return 3;
  if(t.length>=3&&w.includes(t)) return 2;
  const tol=t.length>=6?2:(t.length>=4?1:0);
  if(tol&&(lev(t,w)<=tol||(w.length>t.length&&lev(t,w.slice(0,t.length))<=tol))) return 1;
  return 0;
}
function tokScore(t,words){
  let best=0;
  [t].concat(ALIAS[t]||[]).forEach(a=>words.forEach(w=>{ const x=wordScore(a,w); if(x>best) best=x; }));
  return best;
}
const MPPBAND={"MCCMP GRASS WEEK":1,"MCCMP TABLE ONE":1,"MCCMP TABLE TWO":1,"BASIC WARRIOR TRAINING":1};
function cycEntries(c){
  if(c._ev) return c._ev;
  const out=[];
  const push=(label,i,si,mpp)=>{ if(i==null||i>c.gradi) return;
    out.push({label,words:prepQ(label).split(" ").filter(Boolean),i,si:si==null?null:si,mpp,c}); };
  let lastBand=null;
  SEQ.forEach((cl,si)=>{
    const i=c.inv[si];
    cl.items.forEach(t=>{ if(!t) return;
      const lab=t[0]==="*"?t.slice(1).split("|")[0]:t;
      if(/^graduation$/i.test(lab)||/^rappel/i.test(lab)) return;   /* MPP-dated */
      push(lab,i,si,false); });
    if(cl.tag) push(cl.tag.split("|")[0],i,si,false);
    if(cl.band&&cl.band!==lastBand&&!MPPBAND[cl.band]) push(cl.band,i,si,false);
    lastBand=cl.band;
  });
  const mp=(label,i)=>push(label,i,c.map.get(i),true);
  mp("Grass Week (MCCMP)",c.mp.GRASS[0]);
  mp("Table One starts (MCCMP Table 1)",c.mp.TBL1[0]);
  mp("Table Two starts (MCCMP Table 2)",c.mp.TBL2[0]);
  mp("Basic Warrior Training (BWT)",c.mp.BWT[0]);
  mp("Rappel / FAST Rope",c.mp.rap);
  mp("Crucible",c.mp.CRUX[0]);
  mp("Graduation",c.gradi);
  c._ev=out; return out;
}
let VOCAB=null;
function vocab(){
  if(VOCAB) return VOCAB;
  const st=new Set();
  cycEntries(CYC[0]).forEach(e=>e.words.forEach(w=>st.add(w)));
  VOCAB=[...st]; return VOCAB;
}
const CONAMES=CO_ORDER.map(l=>({l,n:NAMES[l].toLowerCase()}));
function parseQ(q){
  let toks=prepQ(q).split(" ").filter(Boolean), co=null;
  const vHas=t=>vocab().some(w=>w.startsWith(t));
  for(let k=0;k<toks.length&&!co;k++){
    const t=toks[k]; let hit=null;
    if(t.length===1){
      const L=t.toUpperCase();
      const edge=(k===0)||(k===toks.length-1&&L!=="I");
      if(CO_ORDER.includes(L)&&edge) hit=L;
    }else if(t.length>=3){
      const full=CONAMES.find(x=>x.n===t||(x.n==="fox"&&t==="foxtrot"));
      if(full) hit=full.l;
      else if(!vHas(t)){
        const pre=CONAMES.find(x=>x.n.startsWith(t));
        if(pre) hit=pre.l;
        else if(t.length>=4){
          const fz=CONAMES.find(x=>lev(t,x.n)<=(t.length>=6?2:1));
          if(fz&&!vocab().some(w=>lev(t,w)<=1)) hit=fz.l;
        }
      }
    }
    if(hit){ co=hit; toks.splice(k,1); }
  }
  return {co,toks};
}
function matchCycle(c,toks){
  const res=[];
  cycEntries(c).forEach(e=>{
    let tot=0;
    for(const t of toks){ const x=tokScore(t,e.words); if(!x) return; tot+=x; }
    res.push({e,score:tot/Math.max(1,toks.length)});
  });
  return res;
}
function searchCo(co,toks,limitCycles){
  const f=focusI(), cyc=BYCO[co], st=stateAt(co,f), cur=st.cyc||null;
  const up=cyc.filter(c=>c.shipi>f), past=cyc.filter(c=>c.gradi<f).reverse();
  let order=[].concat(cur?[cur]:[],up,past);
  if(limitCycles) order=order.slice(0,limitCycles);
  const groups=[];
  order.forEach(c=>{
    let r=matchCycle(c,toks); if(!r.length) return;
    const top=Math.max(...r.map(x=>x.score));
    r=r.filter(x=>x.score>=top-0.75);              /* drop weak near-misses */
    r.sort((a,b)=>{
      if(c===cur){ const af=a.e.i>=f, bf=b.e.i>=f; if(af!==bf) return af?-1:1; }
      return (b.score-a.score)||(a.e.words.length-b.e.words.length)||(a.e.i-b.e.i); });
    const tag=c===cur?"current cycle":(c.shipi>f?"upcoming cycle":"past cycle");
    groups.push({c,tag,rows:r});
  });
  return groups;
}
const QUICK=["Initial Drill","Table 1 Qualification","Crucible","Final Drill","Graduation"];

      `</span></span><span class="go">&rsaquo;</span></div>`;};
  const groups=searchCo(who,toks,0);

  });

  if(hidden) h+=`<button class="qmore" id="qmoreBtn">Show ${hidden} more</button>`;
  if(!co){
    if(QALL){
      CO_ORDER.filter(l=>l!==who).forEach(l=>{
        searchCo(l,toks,1).forEach(g=>{
          h+=`<div class="qg">${g.c.name} &middot; ${g.tag} &middot; pickup ${fT(g.c.f1i)}</div>`+
             g.rows.slice(0,3).map(x=>rowH(x,false)).join("");
        });
      });

  }
  box.className="qres on"; box.innerHTML=h;
}

/* NOAA approximation, Parris Island 32.33 N 80.69 W; returns absolute instants */
function sunTimes(d){
  const lat=32.335,lon=-80.69,rad=Math.PI/180;
  const n=Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(d.getFullYear(),0,0))/864e5);
  const g=2*Math.PI/365*(n-1);
  const eq=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  const de=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  const ha=Math.acos(Math.cos(90.833*rad)/(Math.cos(lat*rad)*Math.cos(de))-Math.tan(lat*rad)*Math.tan(de))/rad;
  const base=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());
  return{rise:new Date(base+(720-4*(lon+ha)-eq)*6e4),set:new Date(base+(720-4*(lon-ha)-eq)*6e4)};
}
function effTheme(){

  return"light";
}

function showTip(force){

  if(seen&&!force) return;
  try{localStorage.setItem(TIPKEY,"1");}catch(e){}

  const m=document.createElementNS("http://www.w3.org/2000/svg","svg");
  m.setAttribute("class","cmask");m.setAttribute("width",innerWidth);m.setAttribute("height",innerHeight);
  m.innerHTML=`<defs><mask id="coachHole"><rect width="100%" height="100%" fill="#fff"/>${holes.map(b=>`<rect x="${b.left-6}" y="${b.top-6}" width="${b.width+12}" height="${b.height+12}" rx="14" fill="#000"/>`).join("")}</mask></defs><rect width="100%" height="100%" fill="rgba(10,18,26,.55)" mask="url(#coachHole)"/>`;

  const EV=["pointerdown","keydown","wheel","touchstart","resize"];
  const kill=e=>{
    if(e&&(e.type==="pointerdown"||e.type==="touchstart")&&!live.some(x=>x.contains(e.target))){
      swallow=true;addEventListener("click",eat,true);setTimeout(()=>{swallow=false;removeEventListener("click",eat,true);},700);}
    el.remove();extra.forEach(x=>x.remove());EV.forEach(t=>removeEventListener(t,kill,true));};
  EV.forEach(t=>addEventListener(t,kill,true));
}
